<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./index.css">
    <title>3D Engine</title>
</head>

<body style="text-align: center; background: #f0f0f0">
    <h1>3D Engine</h1>
    <div id="render">
        <canvas id="gameCanvas" width="400" height="300" style="border: 2px solid #aaa; background: #fff"></canvas>
        <p id="asciiParagraph"
            style="display:none; font-size: 2px; font-family: 'Courier New', Courier, monospace;letter-spacing: 1px; line-height: 2px; white-space: pre;">
        </p>
    </div>
    <div>
        <button id="mouseLookButton" style="display:none">Press here to look around (ASCII)</button>
    </div>
    <h2 id="fps">FPS: 0</h2>
    <div>
        <button id="mobileControlsButton"
            style="font-family: inherit;font-size: 15px;height: 30px;padding: 0 16px;margin-top: 0px">Mobile
            controls</button>
        <div id="mobileControls" style="display: none">
            <div class="row">
                <div>
                    <b>Move</b><br />
                    <div class="move-controls">
                        <span></span>
                        <button data-key="w">W</button>
                        <span></span>

                        <button data-key="a">A</button>
                        <button data-key="s">S</button>
                        <button data-key="d">D</button>
                    </div>
                </div>

                <div>
                    <b>Look</b><br />
                    <div class="look-controls">
                        <span></span>
                        <button data-look="0,-1">&uarr;</button>
                        <span></span>

                        <button data-look="-1,0">&larr;</button>
                        <button data-look="0,1">&darr;</button>
                        <button data-look="1,0">&rarr;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div>
        ASCII:
        <input type="checkbox" id="useASCII" />
    </div>
    <div id="canvasResRow">
        Canvas resolution:
        <input id="canvasResWidth" value="400" size="4" />
        x
        <input id="canvasResHeight" value="300" size="4" />
    </div>
    <div id="asciiResRow" style="display: none">
        ASCII resolution:
        <input id="asciiResWidth" value="260" size="4" />
        x
        <input id="asciiResHeight" value="195" size="4" />
    </div>
    <div>
        Directional light intensity:
        <input type="range" id="dirIntensity" min="0" max="5" step="0.1" value="1" />
        <span id="dirIntensityText" class="slider-value">1.0</span>
    </div>
    <div>
        Directional light rotate speed:
        <input type="range" id="dirRotateSpeed" min="0" max="50" step="0.1" value="10" />
        <span id="dirRotateSpeedText" class="slider-value">10</span>
    </div>
    <div>
        Point light intensity:
        <input type="range" id="pointIntensity" min="0" max="5" step="0.1" value="1" />
        <span id="pointIntensityText" class="slider-value">1.0</span>
    </div>
    <div>
        Shadow:
        <input type="checkbox" id="useShadow" checked="checked" />
    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
